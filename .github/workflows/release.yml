# Релиз по метке версии: git tag v0.1.0 && git push origin v0.1.0
# Что нового (раздел версии из CHANGELOG.md) → тесты → один Snapkit.exe (версия из метки) →
# релиз на GitHub с этим файлом и его хешем Snapkit.exe.sha256. Без раздела в CHANGELOG.md релиз не выходит.
name: Релиз

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Сборка и публикация
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Что нового из CHANGELOG.md
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $changelog = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $pattern = '(?ms)^## \[' + [regex]::Escape($version) + '\][^\r\n]*\r?\n(.*?)(?=^## \[|\z)'
          $match = [regex]::Match($changelog, $pattern)
          if (-not $match.Success -or $match.Groups[1].Value.Trim().Length -eq 0) {
            throw "В CHANGELOG.md нет раздела «## [$version]» — опишите, что изменилось, и поставьте метку заново"
          }
          Set-Content -Path changes.md -Value $match.Groups[1].Value.Trim() -Encoding utf8

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Тесты
        run: dotnet test Snapkit.slnx --filter "Category!=Clipboard&Category!=Desktop" --nologo

      - name: Сборка Snapkit.exe
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          dotnet publish src/Snapkit.App -c Release -p:SnapkitRelease=true -p:Version=$version -o artifacts/release --nologo

      - name: Публикация релиза
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = 'artifacts/release/Snapkit.exe'
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          # Хеш отдельным файлом: по нему проверяют обновление без GitHub API (у API лимит запросов с одного адреса)
          $sha = 'artifacts/release/Snapkit.exe.sha256'
          [IO.File]::WriteAllText($sha, "$($hash.ToLowerInvariant())  Snapkit.exe`n", [Text.UTF8Encoding]::new($false))
          $notes = @"
          Скачайте **Snapkit.exe** и запустите — программа сама поставит себя в ``%LOCALAPPDATA%\Programs\Snapkit``,
          создаст ярлык в меню «Пуск» и будет запускаться вместе с Windows. Обновление — так же: запустите новый файл.

          Windows может предупредить «Windows защитил ваш компьютер»: у программы нет платной подписи —
          нажмите «Подробнее» → «Выполнить в любом случае».

          SHA-256 файла Snapkit.exe: ``$hash``
          "@
          $notes = ($notes -split "`n" | ForEach-Object { $_.Trim() }) -join "`n"
          $changes = Get-Content changes.md -Raw -Encoding utf8
          Set-Content -Path release-notes.md -Value ($changes.Trim() + "`n`n---`n`n## Установка`n`n" + $notes) -Encoding utf8
          gh release create '${{ github.ref_name }}' $exe $sha --title 'Snapkit ${{ github.ref_name }}' --notes-file release-notes.md
